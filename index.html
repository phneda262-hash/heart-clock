<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #191919;
      --pink-color: #ffd6e1;
      --font-family: 'Instrument Serif', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: flex-start; /* Moved positioning higher up */
      min-height: 100vh;
      font-family: var(--font-family);
      overflow: hidden;
    }

    /* Scaled down to 0.55 and shifted higher up */
    .widget-scaler {
      transform: scale(0.55);
      transform-origin: top center;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: -50px; /* Pulls clock higher up on page */
    }

    .widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 504px;
    }

    .heart-clock-container {
      position: relative;
      width: 504px;
      height: 486px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      margin-top: -15px;
      filter: drop-shadow(0px 0px 10px rgba(255, 214, 225, 0.45))
              drop-shadow(0px 0px 24px rgba(255, 214, 225, 0.2));
    }

    .heart-svg path {
      fill: none;
      stroke: url(#heart-gradient);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .clock-face {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .num {
      position: absolute;
      font-size: 24px;
      font-family: var(--font-family);
      user-select: none;
      line-height: 1;
      width: 30px;
      height: 30px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(180deg, #ffffff 0%, #ffd6e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .num-12 { top: 0px;   left: 95px; }
    .num-1  { top: 12px;  left: 140px; }
    .num-2  { top: 45px;  left: 173px; }
    .num-3  { top: 95px;  left: 185px; }
    .num-4  { top: 145px; left: 173px; }
    .num-5  { top: 178px; left: 140px; }
    .num-6  { top: 190px; left: 95px; }
    .num-7  { top: 178px; left: 50px; }
    .num-8  { top: 145px; left: 17px; }
    .num-9  { top: 95px;  left: 5px; }
    .num-10 { top: 45px;  left: 17px; }
    .num-11 { top: 12px;  left: 50px; }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 2px;
      background-color: var(--pink-color);
    }

    .hour-hand {
      width: 3.5px;
      height: 50px;
      margin-left: -1.75px;
      z-index: 2;
    }

    .minute-hand {
      width: 2.5px;
      height: 72px;
      margin-left: -1.25px;
      opacity: 0.9;
      z-index: 3;
    }

    .second-hand {
      width: 1.5px;
      height: 80px;
      margin-left: -0.75px;
      z-index: 4;
    }

    .center-pin {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: var(--pink-color);
      border: 2px solid var(--bg-color);
      border-radius: 50%;
      z-index: 5;
    }

    .digital-time {
      margin-top: -35px;
      font-size: 44px;
      font-family: var(--font-family);
      letter-spacing: 1px;
      display: flex;
      gap: 12px;
      align-items: baseline;
      z-index: 10;

      background: linear-gradient(180deg, #ffffff 0%, #ffd6e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 0px 12px rgba(255, 214, 225, 0.35));
    }

    .ampm {
      font-size: 1.1em;
      font-family: var(--font-family);
    }
  </style>
</head>
<body>

  <div class="widget-scaler">
    <div class="widget">
      <div class="heart-clock-container">
        <svg class="heart-svg" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="heart-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#ffd6e1" />
            </linearGradient>
          </defs>
          <path d="M 50,30 
                   C 50,15 15,12 15,40 
                   C 15,60 45,85 50,91.3 
                   C 55,85 85,60 85,40 
                   C 85,12 50,15 50,30 Z" />
        </svg>

        <div class="clock-face">
          <span class="num num-12">12</span>
          <span class="num num-1">1</span>
          <span class="num num-2">2</span>
          <span class="num num-3">3</span>
          <span class="num num-4">4</span>
          <span class="num num-5">5</span>
          <span class="num num-6">6</span>
          <span class="num num-7">7</span>
          <span class="num num-8">8</span>
          <span class="num num-9">9</span>
          <span class="num num-10">10</span>
          <span class="num num-11">11</span>

          <div class="hand hour-hand" id="hour"></div>
          <div class="hand minute-hand" id="minute"></div>
          <div class="hand second-hand" id="second"></div>
          <div class="center-pin"></div>
        </div>
      </div>

      <div class="digital-time">
        <span id="digital-clock">--:--</span>
        <span id="ampm" class="ampm">--</span>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Singapore', hour12: false, hour: 'numeric', minute: 'numeric', second: 'numeric' };
      const formatter = new Intl.DateTimeFormat([], options);
      const parts = formatter.formatToParts(now);
      
      let hours = 0, minutes = 0, seconds = 0;
      parts.forEach(part => {
        if (part.type === 'hour') hours = parseInt(part.value, 10);
        if (part.type === 'minute') minutes = parseInt(part.value, 10);
        if (part.type === 'second') seconds = parseInt(part.value, 10);
      });

      const secondDeg = (seconds / 60) * 360;
      const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
      const hourDeg = (((hours % 12) + minutes / 60) / 12) * 360;

      document.getElementById('second').style.transform = `rotate(${secondDeg}deg)`;
      document.getElementById('minute').style.transform = `rotate(${minuteDeg}deg)`;
      document.getElementById('hour').style.transform = `rotate(${hourDeg}deg)`;

      let displayHours = hours % 12;
      displayHours = displayHours ? displayHours : 12;
      const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
      const ampm = hours >= 12 ? 'PM' : 'AM';

      document.getElementById('digital-clock').textContent = `${displayHours}:${displayMinutes}`;
      document.getElementById('ampm').textContent = ampm;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
